# Independent read-only production preflight. Manual full backup is optional
# and NEVER invokes the production folder migration apply operation.
name: "HF - Readable folder migration backup readiness"

on:
  workflow_dispatch:
    inputs:
      take_verified_backup:
        description: "FALSE = read-only checks. TRUE = create+SHA-256 verify a PRIVATE backup snapshot only (no migration)."
        required: true
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - .github/workflows/readable-migration-readiness.yml

permissions:
  contents: read

concurrency:
  group: hf-storage-controller
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'AdityaSreevatsaK/Taiyou-Novels-Storage-Controller' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      HF_TOKEN: ${{ secrets.HF_STORAGE_CONTROLLER_TOKEN }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      HF_BACKUP_REPO: "AdityaSreevatsaK/Taiyous-Novels-Backup"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install tested dependencies
        run: python -m pip install -r requirements.txt
      - name: Read-only production migration preview
        run: python -m taiyou_storage.migrate_production
      - name: Inspect backup dataset existence, privacy and token readability without exposing contents
        shell: bash
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          repo = os.environ["HF_BACKUP_REPO"]
          token = os.environ.get("HF_TOKEN", "")
          if not token:
              print("BACKUP BLOCKED: HF_STORAGE_CONTROLLER_TOKEN missing")
              raise SystemExit(1)
          try:
              info = HfApi(token=token).dataset_info(repo, token=token)
              if info.private is not True or not info.sha:
                  print("BACKUP BLOCKED: destination not verifiably PRIVATE with a valid revision")
                  raise SystemExit(1)
              print("BACKUP READABLE: separate PRIVATE destination exists and is accessible.")
              print("Write access and full backup integrity are not proven until a verified snapshot succeeds.")
          except SystemExit:
              raise
          except Exception:
              print("BACKUP BLOCKED: separate private dataset absent or token cannot read it.")
              print("Create AdityaSreevatsaK/Taiyous-Novels-Backup as PRIVATE and allow this repository's HF_STORAGE_CONTROLLER_TOKEN to read/write that dataset.")
              raise SystemExit(1)
          PY
      - name: Optional full SHA-256-verified private snapshot (NOT a migration)
        if: inputs.take_verified_backup == true
        shell: bash
        run: |
          set -euo pipefail
          python -m taiyou_storage.actions backup --backup-repo "$HF_BACKUP_REPO"
          echo "A complete checksum-verified snapshot was saved to a distinct PRIVATE HF dataset; production files were not changed." >> "$GITHUB_STEP_SUMMARY"
