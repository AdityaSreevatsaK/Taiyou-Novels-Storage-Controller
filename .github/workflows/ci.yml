name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"  # Monday 04:17 UTC, dependency audit only

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Validate dependency graph
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q taiyou_storage tests
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v

  dependency-audit:
    name: Audit Python dependency vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependency audit tooling
        run: python -m pip install "pip-audit>=2.8,<4"
      - name: Audit production requirements and tested constraints
        run: python -m pip_audit -r requirements.txt --progress-spinner off
