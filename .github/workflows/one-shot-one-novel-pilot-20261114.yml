# Owner-approved one-novel production migration pilot, not a library-wide migration.
# Runs only on the dedicated workflow file's first merge to master.
name: "One-shot: migrate exactly ONE readable novel for live Reader acceptance"

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/one-shot-one-novel-pilot-20261114.yml

permissions:
  contents: read

concurrency:
  group: hf-storage-controller
  cancel-in-progress: false

jobs:
  migrate-one-only:
    if: github.repository == 'AdityaSreevatsaK/Taiyou-Novels-Storage-Controller' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      HF_TOKEN: ${{ secrets.HF_STORAGE_CONTROLLER_TOKEN }}
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      HF_MIGRATION_BACKUP_REPO: 'AdityaSreevatsaK/Taiyous-Novels-Backup'
      HF_READABLE_MIGRATION_APPLY: 'true'
      HF_READABLE_MIGRATION_PILOT_ONE: 'true'
      HF_READABLE_MIGRATION_CONFIRM: 'MIGRATE READABLE NOVEL FOLDERS'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check deployed Reader and latest REAL disposable integration acceptance
        shell: bash
        run: |
          set -euo pipefail
          reader='AdityaSreevatsaK/Taiyous-Personal-Library'
          controller='AdityaSreevatsaK/Taiyou-Novels-Storage-Controller'
          reader_head="$(gh api "repos/$reader/branches/master" --jq '.commit.sha')"
          reader_deployed="$(gh api "repos/$reader/actions/workflows/deploy-standalone.yml/runs?branch=master&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')"
          if [ -z "$reader_deployed" ] || [ "$reader_head" != "$reader_deployed" ]; then
            echo '::error::Current Reader master is not verified deployed; refusing any production migration.'
            exit 1
          fi
          test_head="$(gh api "repos/$controller/branches/test/readable-folder-batch-acceptance-20261113" --jq '.commit.sha')"
          test_accepted="$(gh api "repos/$controller/actions/workflows/readable-folder-acceptance.yml/runs?branch=test/readable-folder-batch-acceptance-20261113&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')"
          if [ -z "$test_accepted" ] || [ "$test_head" != "$test_accepted" ]; then
            echo '::error::Latest private HF migration integration acceptance not proven; no production write.'
            exit 1
          fi
          echo 'Deployed Reader and live disposable Hugging Face migration acceptance verified.'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full offline regression suite
        run: |
          python -m compileall -q taiyou_storage tests
          python -m unittest discover -s tests -q
      - name: Back up entire production source and migrate EXACTLY ONE novel
        shell: bash
        run: |
          set -euo pipefail
          test "$HF_READABLE_MIGRATION_PILOT_ONE" = "true"
          python -m taiyou_storage.migrate_production
          echo 'Pilot PASS: exactly ONE complete EPUB/ZIP/cover novel folder migrated, with full verified private backup, stable IDs and SHA-256 checks.' >> "$GITHUB_STEP_SUMMARY"
          echo 'STOP: remaining production novels are intentionally NOT migrated until an authenticated Reader smoke test succeeds.' >> "$GITHUB_STEP_SUMMARY"
      - name: Read-only post-pilot production preview (NEVER migrate another book)
        shell: bash
        run: |
          HF_READABLE_MIGRATION_APPLY=false python -m taiyou_storage.migrate_production
