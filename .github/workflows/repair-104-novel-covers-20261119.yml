name: HF - Repair 104 missing standalone covers

on:
  push:
    branches: [master]
    paths:
      - 'campaigns/covers/activate-104-cover-repair-20261119.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: hf-storage-controller
  cancel-in-progress: false

jobs:
  cover-repair:
    if: github.repository == 'AdityaSreevatsaK/Taiyou-Novels-Storage-Controller'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require one-time newly added activation
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --diff-filter=A --name-only "$BEFORE_SHA" "$HEAD_SHA" -- \
            'campaigns/covers/activate-104-cover-repair-20261119.json' | grep -qx \
            'campaigns/covers/activate-104-cover-repair-20261119.json'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Storage Controller requirements
        run: python -m pip install -r requirements.txt
      - name: Retrieve 104 recovered covers from exact Retriever run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          repository: RichardDaffern/Novel-Retriever
          run-id: 44521807242
          name: novel-cover-images
          github-token: ${{ secrets.NOVEL_LIBRARY_ACTIONS_TOKEN || github.token }}
          path: incoming/covers
      - name: Create a standalone cover-only archive
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root=Path('incoming/covers')
          manifest=json.loads((root/'covers_manifest.json').read_text('utf-8'))
          rows=manifest.get('covers',[])
          if len(rows)!=104 or len({x['source_url'] for x in rows})!=104:
              raise SystemExit('Expected 104 distinct source-matched covers')
          if any(x.get('method') not in ('standalone','embedded_epub') for x in rows):
              raise SystemExit('Unverified cover origin in recovered archive')
          with ZipFile('incoming/verified-covers.zip','w',compression=ZIP_DEFLATED) as z:
              for file in sorted(root.rglob('*')):
                  if file.is_file() and file.name!='cover-recovery-report.json':
                      z.write(file,file.relative_to(root).as_posix())
          print('104 recovered EPUB/original-archive covers validated for preview')
          PY
      - name: Read-only private HF cover preview
        env:
          HF_TOKEN: ${{ secrets.HF_STORAGE_CONTROLLER_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
          HF_HUB_DISABLE_SYMLINKS_WARNING: '1'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$HF_TOKEN" ]]; then
            echo "::error::HF_STORAGE_CONTROLLER_TOKEN is not configured"
            exit 1
          fi
          if ! python -m taiyou_storage.covers incoming/verified-covers.zip \
            --report incoming/cover-preview.csv >"$RUNNER_TEMP/private-cover-preview.log" 2>&1; then
            echo "::error::Private cover preview failed. No cover files were uploaded."
            exit 1
          fi
          echo "Read-only preview succeeded; details remain private."
      - name: Require 104 unambiguous matches and zero conflicts
        run: |
          python - <<'PY'
          import csv,os
          from collections import Counter
          from pathlib import Path
          rows=list(csv.DictReader(Path('incoming/cover-preview.csv').open(
              encoding='utf-8-sig',newline='')))
          counts=Counter(r['status'] for r in rows)
          permitted={'NEW','UPDATE','LINK','UNCHANGED'}
          if len(rows)!=104 or set(counts)-permitted:
              raise SystemExit('Cover preview is incomplete or has unmatched/conflicting books; no writes authorised')
          if len({r['book_id'] for r in rows})!=104 or not all(r['book_id'] for r in rows):
              raise SystemExit('Cover preview does not uniquely match 104 existing books')
          print('Cover preview: 104 unique matches, no missing or conflicting records')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write(f"## Cover repair preview\n\n104 uniquely matched covers. NEW: {counts['NEW']}, UPDATE: {counts['UPDATE']}, LINK: {counts['LINK']}, UNCHANGED: {counts['UNCHANGED']}. No conflicts.\n\n")
          PY
      - name: Apply only reviewed cover-only changes to private HF
        env:
          HF_TOKEN: ${{ secrets.HF_STORAGE_CONTROLLER_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
          HF_HUB_DISABLE_SYMLINKS_WARNING: '1'
        shell: bash
        run: |
          set -euo pipefail
          if ! python -m taiyou_storage.covers incoming/verified-covers.zip --apply \
            --report incoming/cover-apply-plan.csv >"$RUNNER_TEMP/private-cover-apply.log" 2>&1; then
            echo "::error::Cover import stopped. Any completed batches remain intact; re-run after reviewing privately."
            exit 1
          fi
          echo "Cover-only import completed without novel ZIP or EPUB uploads."
      - name: Verify all 104 catalogue covers are now unchanged
        env:
          HF_TOKEN: ${{ secrets.HF_STORAGE_CONTROLLER_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
          HF_HUB_DISABLE_SYMLINKS_WARNING: '1'
        shell: bash
        run: |
          set -euo pipefail
          if ! python -m taiyou_storage.covers incoming/verified-covers.zip \
            --report incoming/post-cover-preview.csv >"$RUNNER_TEMP/private-cover-verify.log" 2>&1; then
            echo "::error::Post-upload cover verification failed."
            exit 1
          fi
          python - <<'PY'
          import csv,os
          from pathlib import Path
          rows=list(csv.DictReader(Path('incoming/post-cover-preview.csv').open(
              encoding='utf-8-sig',newline='')))
          matches=sum(r['status']=='UNCHANGED' for r in rows)
          print(f'Post-import verified covers: {matches}/104')
          if len(rows)!=104 or matches!=104:
              raise SystemExit('Some covers are not confirmed present; investigate before claiming completion')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('**Post-upload verification: 104/104 cover images match the private catalogue.**\n')
          PY
