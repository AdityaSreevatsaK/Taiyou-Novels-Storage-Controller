name: "HF - Back up entire dataset PRIVATELY"
on:
  workflow_dispatch:
    inputs:
      backup_repository:
        description: "Destination PRIVATE HF dataset (must be same storage region for remote copy)"
        required: true
        default: "AdityaSreevatsaK/Taiyous-Novels-Backup"
        type: string
      mode:
        description: "Remote-first copies (fast); full-verified downloads bytes only on cloud runner"
        type: choice
        required: true
        default: remote-first
        options:
          - remote-first
          - full-verified

permissions:
  contents: read

concurrency:
  group: hf-storage-controller
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == 'AdityaSreevatsaK/Taiyou-Novels-Storage-Controller' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Copy and verify in PRIVATE HF dataset (no public artefacts)
        env:
          HF_TOKEN: ${{ secrets.HF_STORAGE_CONTROLLER_TOKEN }}
          BACKUP_REPO: ${{ inputs.backup_repository }}
          BACKUP_MODE: ${{ inputs.mode }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Configure HF_STORAGE_CONTROLLER_TOKEN in Actions secrets."
            exit 1
          fi
          if ! python -m taiyou_storage.actions backup \
            --backup-repo "$BACKUP_REPO" --mode "$BACKUP_MODE" >"$RUNNER_TEMP/private-backup.log" 2>&1; then
            echo "::error::Private HF backup did not complete. No source files were deleted; retry the same mode after reviewing credentials and destination."
            exit 1
          fi
          # This output contains numeric counts only; no filenames, titles,
          # source URLs or novel bytes may be printed in public CI logs.
          grep -E '^(Source files|Objects copied|Previously verified objects reused|Snapshot verified|Full novel downloads): [0-9]+$' "$RUNNER_TEMP/private-backup.log" || true
          echo "Private backup operation completed."
