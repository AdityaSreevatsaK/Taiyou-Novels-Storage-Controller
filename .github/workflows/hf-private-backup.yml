name: "HF - Back up entire dataset PRIVATELY"
on:
  workflow_dispatch:
    inputs:
      backup_repository:
        description: "Different PRIVATE HF dataset (auto-created private if permitted)"
        required: true
        default: "AdityaSreevatsaK/Taiyous-Novels-Backup"
        type: string

permissions:
  contents: read

concurrency:
  group: hf-storage-controller
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Private backup and complete remote SHA-256 verification
        env:
          HF_TOKEN: ${{ secrets.HF_STORAGE_CONTROLLER_TOKEN }}
          BACKUP_REPO: ${{ inputs.backup_repository }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: python -m taiyou_storage.actions backup --backup-repo "$BACKUP_REPO"
