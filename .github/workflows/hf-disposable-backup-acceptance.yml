name: "HF - Disposable remote backup acceptance"
# On master merge, diagnose ValueError origin through allowlisted numeric metrics only.

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/hf-disposable-backup-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-storage-controller
  cancel-in-progress: false

jobs:
  synthetic-acceptance:
    if: github.repository == 'AdityaSreevatsaK/Taiyou-Novels-Storage-Controller' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install tested Controller dependencies
        run: python -m pip install -r requirements.txt
      - name: Copy only synthetic private objects; validate resume and SHA-256
        shell: bash
        env:
          HF_DISPOSABLE_TEST_TOKEN: ${{ secrets.HF_DISPOSABLE_TEST_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          set -euo pipefail
          python -m taiyou_storage.github_output --task backup --mode verify -- python -m taiyou_storage.disposable_backup_acceptance
