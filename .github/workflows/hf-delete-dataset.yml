name: "HF - DELETE ENTIRE dataset repository"
on:
  workflow_dispatch:
    inputs:
      accept_permanent_history_loss:
        description: "I understand deletion removes the dataset repository and history (NO BACKUP)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
concurrency:
  group: hf-storage-controller
  cancel-in-progress: false

jobs:
  delete-repository:
    if: ${{ inputs.accept_permanent_history_loss == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Delete private HF dataset repository
        env:
          HF_TOKEN: ${{ secrets.HF_STORAGE_CONTROLLER_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: python -m taiyou_storage.actions delete-repository --yes
