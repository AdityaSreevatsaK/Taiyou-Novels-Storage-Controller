name: "HF - DELETE ENTIRE dataset repository (backup first)"
on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: "Exact 40-character SOURCE SHA from HF - Inspect library"
        required: true
        type: string
      confirmation:
        description: "Type exactly DELETE DATASET AdityaSreevatsaK/Taiyous-Novels"
        required: true
        type: string
      accept_permanent_history_loss:
        description: "I understand deletion removes the dataset repository and history"
        required: true
        default: false
        type: boolean
      backup_repository:
        description: "Separate PRIVATE HF backup dataset"
        required: true
        default: "AdityaSreevatsaK/Taiyous-Novels-Backup"
        type: string

permissions:
  contents: read

concurrency:
  group: hf-storage-controller
  cancel-in-progress: false

jobs:
  delete-repository:
    if: ${{ inputs.accept_permanent_history_loss == true }}
    environment: hf-destructive
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Full private backup verification THEN delete HF dataset repository
        env:
          HF_TOKEN: ${{ secrets.HF_STORAGE_CONTROLLER_TOKEN }}
          BACKUP_REPO: ${{ inputs.backup_repository }}
          EXPECTED_SHA: ${{ inputs.expected_revision }}
          CONFIRMATION: ${{ inputs.confirmation }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: >-
          python -m taiyou_storage.actions delete-repository
          --backup-repo "$BACKUP_REPO"
          --expected-revision "$EXPECTED_SHA"
          --confirmation "$CONFIRMATION"
