name: "HF - Restore novel genres from original download artifacts"

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: "Commit restored genres to private HF dataset (false = preview counts only)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hf-storage-controller
  cancel-in-progress: false

jobs:
  restore-genres:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Restore verified source tags without replacing any novels
        env:
          HF_TOKEN: ${{ secrets.HF_STORAGE_CONTROLLER_TOKEN }}
          NOVEL_LIBRARY_ACTIONS_TOKEN: ${{ secrets.NOVEL_LIBRARY_ACTIONS_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
        shell: bash
        run: |
          args=()
          if [ '${{ inputs.apply_changes }}' = 'true' ]; then args+=(--apply); fi
          python -m taiyou_storage.genre_repair "${args[@]}"