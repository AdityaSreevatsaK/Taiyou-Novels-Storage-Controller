name: "Release - publish after green master CI"

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: write

concurrency:
  group: taiyou-storage-release-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Tag and publish the verified master revision
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'master' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Create annotated tag and GitHub Release if not already published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current_sha="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [[ "$current_sha" != "$RELEASE_SHA" ]]; then
            echo "Newer master revision exists; skipping stale release run."
            exit 0
          fi
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must be numeric MAJOR.MINOR.PATCH."
            exit 1
          fi
          tag="v$version"
          notes="docs/releases/$tag.md"
          if [[ ! -f "$notes" ]]; then
            echo "::error::Missing public release notes: $notes"
            exit 1
          fi
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $tag already published; no changes made."
            exit 0
          fi
          existing="$(git ls-remote --tags origin "refs/tags/$tag^{}" | cut -f1)"
          if [[ -z "$existing" ]]; then
            existing="$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)"
          fi
          if [[ -n "$existing" && "$existing" != "$RELEASE_SHA" ]]; then
            echo "::error::Tag $tag already targets a different revision; refusing to move it."
            exit 1
          fi
          if [[ -z "$existing" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$RELEASE_SHA" -m "Taiyou Storage Controller $tag"
            git push origin "refs/tags/$tag"
          fi
          gh release create "$tag" --repo "$GH_REPO" --verify-tag \
            --title "Taiyou Storage Controller $tag" \
            --notes-file "$notes"
          echo "Release $tag published for $RELEASE_SHA."
