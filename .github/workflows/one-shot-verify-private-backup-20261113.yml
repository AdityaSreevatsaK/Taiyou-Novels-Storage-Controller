# One-time, explicitly owner-authorised backup verification.
# Triggered only by merging this file into master. No production folder migration.
name: "One-shot - verify new private HF backup and create full snapshot"

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/one-shot-verify-private-backup-20261113.yml

permissions:
  contents: read

concurrency:
  group: hf-storage-controller
  cancel-in-progress: false

jobs:
  verify-and-backup:
    if: github.repository == 'AdityaSreevatsaK/Taiyou-Novels-Storage-Controller' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      HF_TOKEN: ${{ secrets.HF_STORAGE_CONTROLLER_TOKEN }}
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      BACKUP_REPO: 'AdityaSreevatsaK/Taiyous-Novels-Backup'
      SOURCE_REPO: 'AdityaSreevatsaK/Taiyous-Novels'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Storage Controller dependencies
        run: python -m pip install -r requirements.txt
      - name: Diagnose Storage Controller and test credential permissions (read-only)
        shell: bash
        env:
          HF_DISPOSABLE_TEST_TOKEN: ${{ secrets.HF_DISPOSABLE_TEST_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          storage = os.environ.get("HF_TOKEN", "").strip()
          disposable = os.environ.get("HF_DISPOSABLE_TEST_TOKEN", "").strip()
          source = os.environ["SOURCE_REPO"]
          backup = os.environ["BACKUP_REPO"]
          test_repo = "AdityaSreevatsaK/Taiyou-Readable-Folder-Test"
          if source == backup or source == test_repo or backup == test_repo:
              raise SystemExit("BLOCKED: source/test/backup repositories must differ")

          def check(label, token, repo):
              if not token:
                  print(label + ": SECRET MISSING")
                  return False
              try:
                  info = HfApi(token=token).dataset_info(repo_id=repo, token=token)
                  if info.private is True and info.sha:
                      print(label + ": PASS, private repo accessible")
                      return True
                  print(label + ": FAILED, repo not verifiably private")
                  return False
              except Exception as exc:
                  status = getattr(getattr(exc, "response", None), "status_code", None)
                  if status in (401, 403, 404):
                      print(label + f": ACCESS DENIED / NOT FOUND (HTTP {status})")
                  else:
                      print(label + f": UNAVAILABLE ({type(exc).__name__}; HTTP {status or 'unknown'})")
                  return False

          source_ok = check("STORAGE TOKEN to production source", storage, source)
          backup_ok = check("STORAGE TOKEN to new private backup", storage, backup)
          check("STORAGE TOKEN to disposable test dataset (not required)", storage, test_repo)
          check("DISPOSABLE TEST TOKEN to disposable test dataset", disposable, test_repo)
          if not source_ok or not backup_ok:
              print("BLOCKED: no backup writes. Configure HF_STORAGE_CONTROLLER_TOKEN "
                    "to read production AND read/write the PRIVATE backup dataset.")
              raise SystemExit(1)
          print("Both required private sources are readable; continuing to actual "
                "checksum-verified backup, which validates write permissions.")
          PY
      - name: Refresh READ-ONLY production folder migration preview
        shell: bash
        run: |
          python -m taiyou_storage.migrate_production
          echo "Production readable-folder plan checked (no renaming or deletion)." >> "$GITHUB_STEP_SUMMARY"
      - name: Make complete PRIVATE snapshot and independently verify EVERY file SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python -m taiyou_storage.actions backup --backup-repo "$BACKUP_REPO"
          echo "PASS: full private Hugging Face snapshot uploaded and every file independently verified with SHA-256. No production files moved." >> "$GITHUB_STEP_SUMMARY"
