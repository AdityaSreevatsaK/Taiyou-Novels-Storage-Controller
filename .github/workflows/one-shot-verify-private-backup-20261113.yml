# One-time, explicitly owner-authorised backup verification.
# Triggered only by merging this file into master. No production folder migration.
name: "One-shot - verify new private HF backup and create full snapshot"

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/one-shot-verify-private-backup-20261113.yml

permissions:
  contents: read

concurrency:
  group: hf-storage-controller
  cancel-in-progress: false

jobs:
  verify-and-backup:
    if: github.repository == 'AdityaSreevatsaK/Taiyou-Novels-Storage-Controller' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      HF_TOKEN: ${{ secrets.HF_STORAGE_CONTROLLER_TOKEN }}
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      BACKUP_REPO: 'AdityaSreevatsaK/Taiyous-Novels-Backup'
      SOURCE_REPO: 'AdityaSreevatsaK/Taiyous-Novels'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Storage Controller dependencies
        run: python -m pip install -r requirements.txt
      - name: Check token, source and backup dataset privacy without printing contents
        shell: bash
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token = os.environ.get("HF_TOKEN", "").strip()
          if not token:
              print("BLOCKED: HF_STORAGE_CONTROLLER_TOKEN is missing")
              raise SystemExit(1)
          source = os.environ["SOURCE_REPO"]
          backup = os.environ["BACKUP_REPO"]
          if source == backup:
              raise SystemExit("BLOCKED: backup destination equals source")
          api = HfApi(token=token)
          for label, repo in (("SOURCE", source), ("BACKUP", backup)):
              try:
                  info = api.dataset_info(repo_id=repo, token=token)
              except Exception:
                  print(label + " BLOCKED: private dataset is not accessible using HF_STORAGE_CONTROLLER_TOKEN")
                  raise SystemExit(1)
              if info.private is not True or not info.sha:
                  print(label + " BLOCKED: cannot confirm PRIVATE dataset with a revision")
                  raise SystemExit(1)
              print(label + " PASS: correct PRIVATE dataset accessible (revision checked)")
          print("Read access verified. Backup write permissions will be verified by the real snapshot.")
          PY
      - name: Refresh READ-ONLY production folder migration preview
        shell: bash
        run: |
          python -m taiyou_storage.migrate_production
          echo "Production readable-folder plan checked (no renaming or deletion)." >> "$GITHUB_STEP_SUMMARY"
      - name: Make complete PRIVATE snapshot and independently verify EVERY file SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python -m taiyou_storage.actions backup --backup-repo "$BACKUP_REPO"
          echo "PASS: full private Hugging Face snapshot uploaded and every file independently verified with SHA-256. No production files moved." >> "$GITHUB_STEP_SUMMARY"
