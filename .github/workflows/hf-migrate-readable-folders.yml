name: "HF - Safely migrate readable novel folders"

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: "FALSE = read-only preview. TRUE = backed-up production migration, only after live acceptance."
        required: true
        type: boolean
        default: false
      backup_repository:
        description: "Distinct PRIVATE Hugging Face dataset for complete verified backup"
        required: true
        type: string
        default: "AdityaSreevatsaK/Taiyous-Novels-Backup"
      confirmation:
        description: "To apply, type exactly: MIGRATE READABLE NOVEL FOLDERS"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: hf-storage-controller
  cancel-in-progress: false

jobs:
  inspect-or-migrate:
    name: Verify compatibility, full backup, then revision-guarded move
    if: github.repository == 'AdityaSreevatsaK/Taiyou-Novels-Storage-Controller' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      HF_TOKEN: ${{ secrets.HF_STORAGE_CONTROLLER_TOKEN }}
      HF_MIGRATION_BACKUP_REPO: ${{ inputs.backup_repository }}
      HF_READABLE_MIGRATION_APPLY: ${{ inputs.apply_changes }}
      HF_READABLE_MIGRATION_CONFIRM: ${{ inputs.confirmation }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify reader deployment and live disposable HF migration before ANY production write
        if: inputs.apply_changes == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$HF_READABLE_MIGRATION_CONFIRM" != "MIGRATE READABLE NOVEL FOLDERS" ]; then
            echo "::error::Explicit confirmation is missing; production was not changed."
            exit 1
          fi
          if [ "$HF_MIGRATION_BACKUP_REPO" = 'AdityaSreevatsaK/Taiyous-Novels' ]; then
            echo "::error::Production cannot serve as the backup destination."
            exit 1
          fi
          reader=AdityaSreevatsaK/Taiyous-Personal-Library
          current_reader="$(gh api "repos/$reader/branches/master" --jq '.commit.sha')"
          deployed_reader="$(gh api "repos/$reader/actions/workflows/deploy-standalone.yml/runs?branch=master&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')"
          if [ -z "$deployed_reader" ] || [ "$current_reader" != "$deployed_reader" ]; then
            echo "::error::The current reader master has not passed a successful production Deploy Application run."
            exit 1
          fi
          controller=AdityaSreevatsaK/Taiyou-Novels-Storage-Controller
          test_branch="$(gh api "repos/$controller/branches/test/readable-folder-cross-repo-20261113" --jq '.commit.sha')"
          accepted="$(gh api "repos/$controller/actions/workflows/readable-folder-acceptance.yml/runs?branch=test/readable-folder-cross-repo-20261113&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')"
          if [ -z "$accepted" ] || [ "$test_branch" != "$accepted" ]; then
            echo "::error::Live disposable private HF copy/delete/checksum acceptance has not passed for the latest test branch."
            exit 1
          fi
          echo "Verified reader production deployment and successful real disposable private HF migration."
      - name: Install tested Storage Controller dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full regression suite before migration
        run: |
          python -m compileall -q taiyou_storage tests
          python -m unittest discover -s tests -q
      - name: Read-only preview or verified private backup and safe migration
        run: python -m taiyou_storage.migrate_production
      - name: Record result without exposing private novel contents
        run: |
          echo 'Migration operation completed under private dataset revision and verified backup safeguards.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No private file contents or novel names were published.' >> "$GITHUB_STEP_SUMMARY"
