name: "HF - Import Novel-Retriever bundle (cloud only)"

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Novel-Retriever export workflow run ID (not the individual download run)"
        type: string
        required: true
      artifact_family:
        description: "Exact completed export artefact family"
        type: choice
        required: true
        default: taiyou-completed-novels
        options:
          - taiyou-completed-novels
          - taiyou-completed-104
      apply_changes:
        description: "Upload to PRIVATE Hugging Face after successful preview (default NO)"
        type: boolean
        required: true
        default: false
      batch_size:
        description: "Novels per atomic HF commit"
        type: choice
        required: true
        default: "10"
        options:
          - "5"
          - "10"

permissions:
  contents: read
  actions: read

concurrency:
  group: hf-storage-controller
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'AdityaSreevatsaK/Taiyou-Novels-Storage-Controller' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check restricted source inputs
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]{5,15}$ ]]; then
            echo "::error::Enter a numeric Novel-Retriever export run ID."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install tested controller dependencies
        run: python -m pip install -r requirements.txt
      - name: Retrieve completed export directly from Novel-Retriever
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          repository: RichardDaffern/Novel-Retriever
          run-id: ${{ inputs.source_run_id }}
          name: ${{ format('{0}-{1}', inputs.artifact_family, inputs.source_run_id) }}
          github-token: ${{ secrets.NOVEL_LIBRARY_ACTIONS_TOKEN || github.token }}
          path: incoming
      - name: Verify the completed novel bundle without disclosing titles
        shell: bash
        run: |
          set -euo pipefail
          if ! python -m taiyou_storage.cloud_import incoming >"$RUNNER_TEMP/private-bundle-check.log" 2>&1; then
            echo "::error::Completed export failed checksum or structural verification. No uploads were attempted."
            exit 1
          fi
          grep -E '^(Verified novel ZIPs|Verified ZIP bytes): [0-9]+$' "$RUNNER_TEMP/private-bundle-check.log"
      - name: Preview private Hugging Face import
        env:
          HF_TOKEN: ${{ secrets.HF_STORAGE_CONTROLLER_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
          BATCH_SIZE: ${{ inputs.batch_size }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Configure HF_STORAGE_CONTROLLER_TOKEN in Actions secrets."
            exit 1
          fi
          if ! python -m taiyou_storage.upload incoming/novels \
                --covers-folder incoming/covers --dedupe-local --batch-size "$BATCH_SIZE" \
                --report "$RUNNER_TEMP/private-bulk-plan.csv" >"$RUNNER_TEMP/private-bulk-preview.log" 2>&1; then
            echo "::error::Novel preview failed or contains conflicts. No cloud data was changed."
            exit 1
          fi
          python - <<'PY'
          from collections import Counter
          import csv
          import os
          from pathlib import Path
          report=Path(os.environ["RUNNER_TEMP"]) / "private-bulk-plan.csv"
          with report.open(encoding="utf-8-sig", newline="") as stream:
              counts=Counter(row["state"] for row in csv.DictReader(stream))
          print(f"Preview: {counts['NEW']} new, {counts['UPDATE']} updated, "
                f"{counts['UNCHANGED']} unchanged, {counts['DUPLICATE']} equivalent local ZIPs skipped.")
          PY
      - name: Apply approved import (opt-in only)
        if: ${{ inputs.apply_changes == true }}
        env:
          HF_TOKEN: ${{ secrets.HF_STORAGE_CONTROLLER_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
          BATCH_SIZE: ${{ inputs.batch_size }}
        shell: bash
        run: |
          set -euo pipefail
          if ! python -m taiyou_storage.upload incoming/novels \
                --covers-folder incoming/covers --dedupe-local --batch-size "$BATCH_SIZE" \
                --report "$RUNNER_TEMP/private-bulk-plan.csv" --apply \
                >"$RUNNER_TEMP/private-bulk-apply.log" 2>&1; then
            echo "::error::Private HF upload stopped. Already committed batches are preserved; re-run the same export after reviewing private conflicts."
            exit 1
          fi
          echo "Private HF import completed; per-novel details remain private."
