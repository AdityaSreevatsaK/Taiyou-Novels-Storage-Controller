name: "HF - Inspect library (read only)"
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-storage-controller
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Inspect private catalogue (counts only, no novel names)
        env:
          HF_TOKEN: ${{ secrets.HF_STORAGE_CONTROLLER_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: python -m taiyou_storage.actions inspect
