name: "HF - Run library checks (read only)"

on:
  workflow_dispatch:
    inputs:
      depth:
        description: "Quick checks listings; manifest checks small sidecars; deep downloads privately to the runner"
        required: true
        type: choice
        default: manifest
        options:
          - quick
          - manifest
          - deep

permissions:
  contents: read

concurrency:
  group: hf-storage-controller
  cancel-in-progress: false

jobs:
  check:
    name: Private library inspections (counts only)
    if: github.repository == 'AdityaSreevatsaK/Taiyou-Novels-Storage-Controller' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install tested dependencies
        run: python -m pip install -r requirements.txt
      - name: Check private library (count summary only, no remote writes)
        env:
          HF_TOKEN: ${{ secrets.HF_INSPECTION_READ_TOKEN || secrets.HF_STORAGE_CONTROLLER_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
          CHECK_DEPTH: ${{ inputs.depth }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Configure HF_INSPECTION_READ_TOKEN or HF_STORAGE_CONTROLLER_TOKEN in repository Actions secrets."
            exit 1
          fi
          python -m taiyou_storage.github_checks --mode "$CHECK_DEPTH"
