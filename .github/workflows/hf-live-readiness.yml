name: "HF - Verify remote-first readiness (read only)"

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/hf-live-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-storage-controller
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'AdityaSreevatsaK/Taiyou-Novels-Storage-Controller' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install tested dependencies
        run: python -m pip install -r requirements.txt
      - name: Check cloud backup readiness (metadata only, no write)
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_STORAGE_CONTROLLER_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          set -euo pipefail
          python -m taiyou_storage.cloud_readiness
      - name: Verify quick catalogue and storage audit (no novel downloads)
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_INSPECTION_READ_TOKEN || secrets.HF_STORAGE_CONTROLLER_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          set -euo pipefail
          python -m taiyou_storage.github_checks --mode quick
