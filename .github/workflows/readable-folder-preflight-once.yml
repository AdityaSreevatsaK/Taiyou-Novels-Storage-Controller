# One-time, read-only inspection immediately after migration tooling is merged.
# No dataset writes, no backup creation, no title or personal content logs.
name: "One-shot - inspect production readable-folder migration plan"

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/readable-folder-preflight-once.yml"

permissions:
  contents: read

concurrency:
  group: hf-storage-controller
  cancel-in-progress: false

jobs:
  preview:
    if: github.repository == 'AdityaSreevatsaK/Taiyou-Novels-Storage-Controller'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_STORAGE_CONTROLLER_TOKEN }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Live PRIVATE production catalogue PREVIEW only
        run: |
          python -m taiyou_storage.migrate_production
          echo "Read-only private dataset migration preview executed; no file moves." >> "$GITHUB_STEP_SUMMARY"
      - name: Check whether distinct private backup destination is accessible
        shell: bash
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          repo = "AdityaSreevatsaK/Taiyous-Novels-Backup"
          try:
              info = HfApi(token=os.environ["HF_TOKEN"]).dataset_info(repo)
              if info.private is not True:
                  print("BACKUP NOT READY: target is not PRIVATE")
              else:
                  print("BACKUP READY: a separate PRIVATE dataset is accessible")
          except Exception:
              print("BACKUP NOT READY: separate PRIVATE backup dataset inaccessible or absent")
          PY
