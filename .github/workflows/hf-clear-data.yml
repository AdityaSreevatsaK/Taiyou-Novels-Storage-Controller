name: "HF - CLEAR ALL data"
on:
  workflow_dispatch:
    inputs:
      confirm_clear:
        description: "I understand this deletes all novel data (NO BACKUP)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
concurrency:
  group: hf-storage-controller
  cancel-in-progress: false

jobs:
  clear:
    if: ${{ inputs.confirm_clear == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Clear private HF library data
        env:
          HF_TOKEN: ${{ secrets.HF_STORAGE_CONTROLLER_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: python -m taiyou_storage.actions clear --yes
